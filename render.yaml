# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# Nothing is deployed until you create a Blueprint from this file in the Render
# dashboard. Values marked "sync: false" are secrets/addresses you type in the
# dashboard; they are never stored in this file.
services:
  - type: web
    name: nirmaan-api
    runtime: node
    plan: free
    # Singapore is Render's closest region to India (and to an Atlas cluster in Mumbai).
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render runs the app behind one proxy: needed so rate limiting sees real client IPs.
      - key: TRUST_PROXY
        value: "1"
      # MongoDB Atlas connection string (production database user). Secret.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nirmaan
      # Random secret generated by Render once, when the Blueprint is created.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # The website's address on Vercel, e.g. https://your-shop.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      # The permanent address printed in the QR code (normally the same as CORS_ORIGINS).
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: nirmaan
